<!DOCTYPE html>
<html>
<head>
    <title>Conversation Thread</title>
</head>
<body>
    <h1>Message: {{ message.content }}</h1>
    <h2>Replies</h2>
    <ul>
        {% for reply in replies %}
            <li>{{ reply.content }} (From: {{ reply.sender }})</li>
        {% empty %}
            <li>No replies</li>
        {% endfor %}
    </ul>
</body>
</html>
