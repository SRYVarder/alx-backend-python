
<!DOCTYPE html>
<html>
<head>
    <title>Message History</title>
</head>
<body>
    <h1>Message: {{ message.content }}</h1>
    <h2>Edit History</h2>
    <ul>
        {% for entry in history %}
            <li>{{ entry.old_content }} (Edited at: {{ entry.edited_at }})</li>
        {% empty %}
            <li>No edit history</li>
        {% endfor %}
    </ul>
</body>
</html>
